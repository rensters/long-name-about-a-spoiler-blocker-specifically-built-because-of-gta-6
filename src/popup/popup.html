<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spoiler Shield</title>
    <link rel="stylesheet" href="../ui/base.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img src="../../icons/icon-32.png" alt="" width="24" height="24" />
      <h1>Spoiler Shield</h1>
      <label class="switch" title="Turn everything on/off">
        <input type="checkbox" id="enabled" />
        <span class="track"></span>
      </label>
    </header>

    <p id="state" class="state"></p>

    <section class="count-box">
      <div class="count" id="count">–</div>
      <div class="count-label" id="count-label">things blurred on this page</div>
    </section>

    <div class="row">
      <button type="button" id="pause" class="btn">Pause 10 min</button>
      <label class="site-toggle">
        <span id="site-name">This site</span>
        <span class="switch small">
          <input type="checkbox" id="site" />
          <span class="track"></span>
        </span>
      </label>
    </div>

    <form id="add" class="add" autocomplete="off">
      <label for="term" class="label">Quick add a keyword</label>
      <div class="add-row">
        <input id="term" type="text" placeholder="e.g. a new character name" maxlength="300" />
        <button type="submit" class="btn primary">Add</button>
      </div>
      <div class="add-row small-row">
        <select id="tier" aria-label="How strong">
          <option value="strong">strong: always blurs</option>
          <option value="weak">weak: needs a second clue</option>
        </select>
        <select id="pack" aria-label="Which pack"></select>
      </div>
      <p id="add-msg" class="msg" role="status"></p>
    </form>

    <div id="lockbox" class="lockbox" hidden>
      <p id="lock-why">Locked. Type your phrase to do that.</p>
      <div class="add-row">
        <input id="phrase" type="password" autocomplete="off" placeholder="your lock phrase" />
        <button type="button" id="phrase-go" class="btn primary">OK</button>
      </div>
      <button type="button" id="phrase-cancel" class="link">never mind, keep it on</button>
    </div>

    <div id="banners"></div>

    <footer>
      <button type="button" id="settings" class="link">Settings</button>
      <span id="storage" class="muted"></span>
    </footer>

    <script src="../lib/shim.js"></script>
    <script src="../lib/normalize.js"></script>
    <script src="../lib/packs.js"></script>
    <script src="../lib/store.js"></script>
    <script src="../lib/edit.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
